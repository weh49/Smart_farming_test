name: CI - IoT API & MQTT Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # 被测系统的依赖：PostgreSQL（数据库）
    # MQTT Broker 改为在步骤中手动启动（mosquitto 2.x 默认拒绝匿名连接，需挂载自定义配置）
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------- 被测系统：iot-backend (Node/TS + Prisma) ----------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: iot-backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix iot-backend

      - name: Start MQTT broker
        run: |
          docker run -d --name mqtt -p 1883:1883 \
            -v "$PWD/.github/mosquitto.conf":/mosquitto/config/mosquitto.conf \
            eclipse-mosquitto:2

      - name: Apply database migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          cd iot-backend
          npx prisma migrate deploy

      - name: Start backend  # 以 tsx 直接运行 TS 源码（与本地 npm run dev 一致）
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
          PORT: 3001
          ENABLE_MQTT: 1
          MQTT_HOST: localhost
          MQTT_PORT: 1883
          # 后端 assertEnv() 要求用户名/密码非空；PROTOCOL 不设会默认 mqtts(TLS)
          MQTT_PROTOCOL: mqtt
          MQTT_USERNAME: ci
          MQTT_PASSWORD: ci
        run: |
          cd iot-backend
          npx tsx src/index.ts &
          sleep 10
          curl --retry 15 --retry-connrefused --retry-delay 2 -s -o /dev/null -w "backend http code: %{http_code}\n" http://localhost:3001/api/ || true

      # ---------- 测试端：Python + pytest ----------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r test/requirements.txt

      - name: Run tests
        env:
          API_BASE_URL: http://localhost:3001/api
          MQTT_BROKER_HOST: localhost
          MQTT_BROKER_PORT: 1883
        run: |
          set +e
          pytest -v --tb=short 2>&1 | tee /tmp/pytest.log
          rc=${PIPESTATUS[0]}
          # 将失败用例以注解形式输出到 Actions 页面，便于快速定位
          if [ "$rc" -ne 0 ]; then
            echo "::group::失败用例明细"
            grep -E "^(FAILED|ERROR) " /tmp/pytest.log | head -20 | while IFS= read -r line; do
              echo "::error::$line"
            done
            echo "::endgroup::"
          fi
          exit "$rc"
